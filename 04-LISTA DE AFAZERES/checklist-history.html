<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico do Checklist</title>
    <link rel="stylesheet" href="checklist.css">
</head>

<body>
    <main class="page">
        <section class="card">
            <header class="card-header">
                <h1>Histórico do Checklist</h1>
                <p>Registros de dias salvos aparecem abaixo.</p>
            </header>

            <section class="history-card">
                <header>
                    <h2>Registros salvos</h2>
                    <p id="historyMessage">Os dados de cada dia serão salvos aqui.</p>
                </header>
                <ul class="history-list" id="historyList"></ul>
            </section>

            <div class="footer-actions">
                <a href="checklist.html" class="button-link">Voltar ao Checklist</a>
            </div>
        </section>
    </main>
    <script src="checklist.js"></script>
</body>

</html>
